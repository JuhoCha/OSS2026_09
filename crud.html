<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>

<body>
    <div class="header">
        <h1>TODO LIST</h1>
    </div>
    <div class="todo-list">
        TODO LIST<br>
        제목 : <input type="text" id="title" placeholder="제목" minlength="5" required> <br>
        과목 : <input type="text" id="subject" placeholder="과목" required> <br>
        할일 : <input type="text" id="task" placeholder="할일" required> <br>
        기한 : <input type="date" id="deadline" placeholder="기한" required> <br>
        우선순위 : <input type="number" id="priority" placeholder="우선순위" min="1" max="20" required> <br>
        <button id="todoBtn">일정 등록</button>
    </div><br>

    <div class="todo-table">
        <h3>TODO LIST</h3>
        검색 : <input type="text" id="search" placeholder="제목 검색"> <br>
        <table border="1">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>제목</th>
                    <th>과목</th>
                    <th>할일</th>
                    <th>기한</th>
                    <th>우선순위</th>
                    <th>완료</th>
                </tr>
            </thead>
            <tbody id="todoList">
            </tbody>
        </table>
    </div>

    <footer>
        <p>22400719 Juho Cha &copy; OSSCLASS.</p>
    </footer>
</body>

</html>
